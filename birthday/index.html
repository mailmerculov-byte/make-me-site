      content="Приглашение на юбилей Александра: 30 лет, лофт-вечеринка, живой таймер, программа вечера и вишлист подарков."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('party-palette');
          var isLight = stored === 'light-pastel';
          if (!stored) {
            isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          }
          var root = document.documentElement;
          if (isLight) {
            root.style.setProperty('--site-bg', '#FAF5EC');
            root.style.setProperty('--site-text', '#33312C');
            root.style.setProperty('--site-muted', 'rgba(51, 49, 44, 0.72)');
            root.style.setProperty('--site-primary', '#D15640');
            root.style.setProperty('--site-glow', 'rgba(209, 86, 64, 0.3)');
            root.style.setProperty('--on-accent', '#FFF7EF');
            root.style.setProperty('--glass-bg', 'rgba(255, 255, 255, 0.6)');
            root.style.setProperty('--glass-border', 'rgba(51, 49, 44, 0.1)');
            root.style.setProperty('--hero-overlay', 'rgba(51, 49, 44, 0.55)');
            root.style.setProperty('--hero-text', '#FFFFFF');
            root.style.setProperty('--hero-muted', 'rgba(255, 255, 255, 0.78)');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
