<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Подарок: диск GTA VI для PlayStation 5">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b143f"/>
      <stop offset="45%" stop-color="#5c3070"/>
      <stop offset="78%" stop-color="#b95a72"/>
      <stop offset="100%" stop-color="#f2a065"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#8fd8ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#5b8cff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="casePlastic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfe6ff" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#6fb4ec" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#2f6fbd" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="caseSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#245f9f"/>
      <stop offset="100%" stop-color="#7cc0f2"/>
    </linearGradient>
    <linearGradient id="coverSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1a5e"/>
      <stop offset="42%" stop-color="#7c3fa8"/>
      <stop offset="72%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#5be0d8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2bd"/>
      <stop offset="50%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#e08b28"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff4ff"/>
      <stop offset="20%" stop-color="#7fc8ff"/>
      <stop offset="40%" stop-color="#c9a7ff"/>
      <stop offset="60%" stop-color="#ffc1d8"/>
      <stop offset="80%" stop-color="#9fe8d8"/>
      <stop offset="100%" stop-color="#6fa8ff"/>
    </linearGradient>
    <radialGradient id="discShine" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1b2a5e" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="coverClip">
      <rect x="272" y="122" width="238" height="278" rx="5"/>
    </clipPath>
  </defs>

  <rect width="800" height="520" rx="24" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.75">
    <circle cx="90" cy="70" r="1.6"/><circle cx="160" cy="140" r="1"/>
    <circle cx="700" cy="90" r="1.8"/><circle cx="620" cy="180" r="1.1"/>
    <circle cx="250" cy="60" r="1.2"/><circle cx="540" cy="60" r="1"/>
    <circle cx="60" cy="240" r="1"/><circle cx="760" cy="270" r="1.4"/>
  </g>
  <ellipse cx="400" cy="270" rx="320" ry="230" fill="url(#halo)"/>
  <ellipse cx="400" cy="452" rx="230" ry="24" fill="#160e30" opacity="0.5" filter="url(#soft)"/>

  <!-- PS5 game case -->
  <g transform="rotate(-5 390 260)">
    <rect x="232" y="100" width="296" height="318" rx="14" fill="#0d1d33" opacity="0.55"/>
    <rect x="228" y="96" width="296" height="318" rx="14" fill="url(#casePlastic)" stroke="#d8f1ff" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="228" y="96" width="26" height="318" rx="10" fill="url(#caseSpine)" opacity="0.95"/>
    <g stroke="#eaf7ff" stroke-opacity="0.5" stroke-width="2">
      <path d="M262 96 V414"/><path d="M228 130 H524"/><path d="M228 380 H524"/>
    </g>

    <!-- cover art -->
    <g clip-path="url(#coverClip)">
      <rect x="272" y="122" width="238" height="278" fill="url(#coverSky)"/>
      <circle cx="470" cy="230" r="52" fill="#ffb3d1" opacity="0.92"/>
      <circle cx="470" cy="230" r="76" fill="#ff6b9d" opacity="0.22"/>
      <path d="M272 300 L310 268 L344 292 L382 250 L420 288 L458 258 L510 300 V400 H272 Z" fill="#2c1d47" opacity="0.85"/>
      <path d="M272 330 L330 300 L378 324 L430 292 L510 334 V400 H272 Z" fill="#191130" opacity="0.9"/>
      <g stroke="#0f0a20" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M296 388 V332 M296 348 Q280 336 282 320 M296 344 Q314 334 314 318"/>
        <path d="M488 390 V336 M488 350 Q472 338 474 324 M488 346 Q506 338 506 322"/>
      </g>
      <text x="391" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#fff4d0">GTA</text>
      <text x="391" y="284" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="74" font-weight="900" fill="url(#gold)" stroke="#7a3d17" stroke-width="2">VI</text>
      <rect x="286" y="364" width="72" height="22" rx="5" fill="#f4f8ff" opacity="0.95"/>
      <text x="322" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#1b3f78">PS5</text>
    </g>
    <rect x="272" y="122" width="238" height="278" rx="5" fill="none" stroke="#eaf7ff" stroke-opacity="0.6" stroke-width="2"/>

    <!-- spine marks -->
    <g fill="#eaf7ff" opacity="0.8">
      <rect x="234" y="150" width="14" height="3" rx="1.5"/>
      <rect x="234" y="390" width="14" height="3" rx="1.5"/>
    </g>
  </g>

  <!-- disc -->
  <g transform="rotate(9 570 270)">
    <circle cx="570" cy="270" r="112" fill="#12213f" opacity="0.45" filter="url(#soft)"/>
    <circle cx="570" cy="270" r="106" fill="url(#disc)" stroke="#e9f7ff" stroke-width="3"/>
    <circle cx="570" cy="270" r="106" fill="url(#discShine)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
      <circle cx="570" cy="270" r="88"/><circle cx="570" cy="270" r="64"/><circle cx="570" cy="270" r="42"/>
    </g>
    <circle cx="570" cy="270" r="21" fill="#f4f8ff" stroke="#9fc6ee" stroke-width="4"/>
    <circle cx="570" cy="270" r="9" fill="#1b2a5e"/>
    <text x="570" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="3" fill="#17346a" opacity="0.8">GTA VI</text>
    <text x="570" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#17346a" opacity="0.7">PS5</text>
  </g>

  <!-- sparkles -->
  <g fill="#fff3c4">
    <path d="M150 190 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z"/>
    <path d="M690 400 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8 Z"/>
    <path d="M180 390 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z"/>
  </g>
</svg>
