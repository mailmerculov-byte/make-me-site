<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Превью квеста Парящий Остров Сюрпризов">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150f38"/>
      <stop offset="45%" stop-color="#4a2a6b"/>
      <stop offset="78%" stop-color="#b1556d"/>
      <stop offset="100%" stop-color="#f2a065"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ffd08a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87bd7d"/>
      <stop offset="100%" stop-color="#5f9164"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d556a"/>
      <stop offset="100%" stop-color="#32283f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#e0a83c"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="54" cy="44" r="1.3"/><circle cx="130" cy="82" r="1"/>
    <circle cx="540" cy="50" r="1.5"/><circle cx="590" cy="120" r="1"/>
    <circle cx="220" cy="38" r="1"/><circle cx="430" cy="64" r="1.2"/>
    <circle cx="36" cy="180" r="1"/><circle cx="620" cy="210" r="1.2"/>
  </g>
  <ellipse cx="320" cy="225" rx="270" ry="170" fill="url(#glow)"/>
  <circle cx="118" cy="120" r="30" fill="#ffd9a8" opacity="0.85"/>
  <circle cx="118" cy="120" r="48" fill="#ffca8a" opacity="0.14"/>

  <!-- floating island underside -->
  <path d="M196 206 L246 178 L394 178 L444 206 L444 234 L400 258 L366 300 L334 340 L306 318 L272 280 L236 250 L196 234 Z" fill="url(#rock)"/>
  <g stroke="#4a3b52" stroke-width="2" opacity="0.65">
    <path d="M236 250 L272 280 L306 318"/><path d="M272 280 L334 340"/><path d="M400 258 L366 300 L334 340"/>
    <path d="M196 220 L444 220"/>
  </g>

  <!-- grass top -->
  <path d="M196 206 L246 178 L394 178 L444 206 L394 234 L246 234 Z" fill="url(#grass)"/>
  <g stroke="#4f7d55" stroke-width="1" opacity="0.5">
    <path d="M246 178 L246 234"/><path d="M296 178 L296 234"/><path d="M346 178 L346 234"/><path d="M394 178 L394 234"/>
    <path d="M220 192 L370 192"/><path d="M220 220 L370 220"/>
  </g>

  <!-- winding path -->
  <path d="M320 232 L320 216 L360 216 L392 202 L356 188 L312 200 L272 188 L244 202 L278 216 L320 216"
        fill="none" stroke="#e0bd8b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>

  <!-- lighthouse -->
  <g>
    <rect x="236" y="132" width="22" height="46" rx="2" fill="#f6efe2"/>
    <rect x="236" y="148" width="22" height="14" fill="#d9604f"/>
    <rect x="239" y="122" width="16" height="12" fill="#ffd166"/>
    <rect x="234" y="118" width="26" height="5" rx="2" fill="#4a2f3f"/>
    <circle cx="247" cy="128" r="16" fill="#ffd166" opacity="0.25"/>
  </g>

  <!-- trees -->
  <g>
    <rect x="286" y="168" width="4" height="14" fill="#6b4730"/>
    <rect x="279" y="152" width="18" height="16" fill="#3d8a63"/>
    <rect x="283" y="146" width="12" height="8" fill="#57a873"/>
    <rect x="356" y="158" width="4" height="12" fill="#6b4730"/>
    <rect x="350" y="144" width="16" height="14" fill="#2d6b52"/>
    <rect x="353" y="139" width="11" height="7" fill="#57a873"/>
  </g>

  <!-- waterfall -->
  <g opacity="0.9">
    <rect x="438" y="206" width="10" height="58" rx="2" fill="#43b9d6"/>
    <rect x="442" y="214" width="6" height="48" fill="#9fe8f4" opacity="0.8"/>
    <rect x="434" y="264" width="18" height="7" rx="3" fill="#eafcff" opacity="0.7"/>
  </g>

  <!-- chest with glow -->
  <ellipse cx="320" cy="216" rx="34" ry="14" fill="#ffd166" opacity="0.35"/>
  <g>
    <rect x="306" y="198" width="28" height="18" rx="2" fill="#7c4a2c" stroke="#4a2a18" stroke-width="2"/>
    <rect x="304" y="192" width="32" height="9" rx="2" fill="#a5673d" stroke="#4a2a18" stroke-width="2"/>
    <rect x="312" y="191" width="4" height="18" fill="#d9a23a"/>
    <rect x="324" y="191" width="4" height="18" fill="#d9a23a"/>
    <rect x="318" y="202" width="6" height="7" rx="1" fill="#ffe08a"/>
    <path d="M320 174 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z" fill="#ffe08a"/>
  </g>

  <!-- little hero -->
  <g>
    <rect x="334" y="212" width="9" height="10" fill="#3d5a80"/>
    <rect x="333" y="201" width="11" height="12" fill="#ef6f6c"/>
    <rect x="334" y="194" width="9" height="8" fill="#ffca9f"/>
    <rect x="333" y="192" width="11" height="3" fill="#3a2b3a"/>
  </g>

  <!-- lanterns -->
  <g>
    <circle cx="270" cy="200" r="4" fill="#ffd166"/>
    <circle cx="392" cy="200" r="4" fill="#ffd166"/>
    <circle cx="320" cy="184" r="4" fill="#ffd166"/>
  </g>
</svg>
